# サイトの基本設定
baseURL: "https://numa-meta.com/" # サイトの公開URL（重要：必ず完全なURLにしてください）
title: "NUMA - Nippon Universities Metaverse Alliance"
copyright: "© [NUMA 全日本大学メタバース連盟](https://numa-meta.com/)"
theme: PaperMod
defaultContentLanguage: ja
images: ["images/og-cover.png"]

# Hugoのビルド設定
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
mainsections: ["posts"]

# キャッシュ設定
caches:
  images:
    dir: :cacheDir/images

# 出力コンテンツの最適化設定
minify:
  disableXML: true

# ページネーション設定
pagination:
  pagerSize: 5

# 言語設定
languages:
  ja:
    label: "日本語"
    weight: 1
    title: "NUMA 全日本大学メタバース連盟"
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: "NUMAとは"
          url: /aboutus
          weight: 1
        - name: "加盟団体"
          url: /members
          weight: 2
        - name: "パートナー・協賛"
          url: /with-us
          weight: 3
        - name: "Posts"
          url: /posts
          weight: 5
        - name: "Tags"
          url: /tags
          weight: 6
        - name: "X"
          url: "https://x.com/numa_meta_"
          weight: 10

# 出力フォーマット
outputs:
  home:
    - HTML
    - RSS
    - JSON

# テーマ（PaperMod）のパラメータ設定
params:
  env: production
  description: "NUMA 全日本大学メタバース連盟の公式サイトです。NUMA (Nippon Universities Metaverse Alliance)は、日本全国のXR・メタバース系サークルの互助を実現する組織です。様々な知見を集積するだけでなく、お互いに切磋琢磨できる環境も実現します。"
  author: "NUMA 全日本大学メタバース連盟"

  # --- 表示と機能の切り替え ---
  defaultTheme: "light" # "auto", "light", "dark" から選択
  disableThemeToggle: true # trueにするとテーマ切り替えボタンを非表示
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  # --- ホームページの設定 ---
  homeInfoParams:
    Title: "ホーム"
    Content: >
      🤝NUMAは日本全国のXR・メタバース系サークルの互助組織を目指します。

  # --- アセット（CSS, faviconなど）の設定 ---
  assets:
    customCSS: ["css/home-info.css"]
    favicon: "favicon/favicon.ico"
    disableHLJS: true # PaperMod内蔵のハイライトJSを無効化（Hugo標準のハイライト機能を使うため）

  # --- SNSアイコン（必要に応じてコメントを外してURLを設定） ---
  # socialIcons:
  #   - name: X
  #     url: "https://x.com/numa_meta_"
  #   - name: Discord
  #     url: ""

# Markdownのレンダリング設定
markup:
  goldmark:
    renderer:
      unsafe: true # Markdown内でHTMLタグを許可する
  highlight:
    noClasses: false # シンタックスハイライトにCSSクラスを使用する（Hugoの標準的な方法）

# 外部サービス連携の設定（必要に応じてコメントを外す）
# services:
#   instagram:
#     disableInlineCSS: true
#   twitter: # x.com へのエイリアス
#     disableInlineCSS: true
